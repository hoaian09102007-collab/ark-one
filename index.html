<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Xem Video 360° Cảm Biến</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
        /* Giao diện màn hình chờ (Overlay) bắt buộc tương tác */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        p { margin-bottom: 30px; color: #e0e0e0; max-width: 400px; line-height: 1.5; }
        #start-btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background-color: #00ecbc;
            color: #1e3c72;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,236,188,0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        #start-btn:active {
            transform: scale(0.95);
        }
        /* Thông báo trạng thái tải */
        #loading-status {
            margin-top: 15px;
            font-size: 14px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>TRÌNH PHÁT VIDEO 360°</h1>
        <p>Vui lòng bấm nút bên dưới để cấp quyền cho Cảm biến xoay góc nhìn và phát Video.</p>
        <button id="start-btn">BẮT ĐẦU XEM</button>
        <div id="loading-status"></div>
    </div>

    <a-scene loading-screen="enabled: false">
        <a-assets>
            <video id="video360" 
                   src="wps_wid.cid-478070967.1762434006.exe" 
                   preload="auto"
                   loop="true" 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"></a-entity>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>
    </a-scene>

    <script>
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('loading-status');
        const video = document.getElementById('video360');

        // Khi người dùng bấm nút Bắt đầu
        startBtn.addEventListener('click', function () {
            statusText.innerText = "Đang khởi tạo cảm biến và video...";

            // 1. Xử lý yêu cầu quyền cảm biến trục tọa độ trên iOS (Safari 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && 
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            HienThiVideo();
                        } else {
                            alert("Bạn đã từ chối quyền cảm biến. Ứng dụng sẽ không thể xoay góc nhìn khi di chuyển điện thoại!");
                            HienThiVideo(); // Vẫn cho phát video nhưng không có cảm biến
                        }
                    })
                    .catch(error => {
                        console.error("Lỗi xin quyền cảm biến: ", error);
                        HienThiVideo();
                    });
            } else {
                // Đối với Android hoặc PC (Không cần xin quyền qua hàm requestPermission)
                HienThiVideo();
            }
        });

        // Hàm ẩn màn hình chờ và kích hoạt phát video
        function HienThiVideo() {
            overlay.style.display = 'none'; // Ẩn màn hình chờ

            // Phát video bằng lệnh Javascript (vượt qua tính năng chặn tự động phát)
            video.play().then(() => {
                console.log("Video đang phát thành công!");
            }).catch(error => {
                console.error("Không thể phát video: ", error);
                alert("Lỗi phát video! Vui lòng kiểm tra lại kết nối mạng hoặc định dạng video.");
            });
        }
    </script>
</body>
</html>
