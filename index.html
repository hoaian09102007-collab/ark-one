<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Xem Video 360 Độ</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        /* Giao diện nút bấm yêu cầu quyền truy cập cảm biến */
        #permission-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div id="permission-overlay">
        <h2>Trải Nghiệm Video 360°</h2>
        <p>Ứng dụng cần quyền truy cập vào cảm biến chuyển động (Gyroscope) để xoay video theo điện thoại của bạn.</p>
        <button class="btn" id="start-btn">Bắt đầu xem</button>
    </div>

    <a-scene loading-screen="enabled: false">
        <a-assets>
            <video id="video360" 
                   src="cavoi.mp4" 
                   autoplay 
                   loop 
                   muted 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"></a-entity>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>
    </a-scene>

    <script>
        const overlay = document.getElementById('permission-overlay');
        const startBtn = document.getElementById('start-btn');
        const video = document.getElementById('video360');

        startBtn.addEventListener('click', function () {
            // Phát video ngay khi user tương tác (Tránh cơ chế chặn autoplay của trình duyệt)
            video.play();

            // Kiểm tra và xin quyền truy cập cảm biến đối với thiết bị iOS (iPhone/iPad)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            overlay.style.display = 'none'; // Ẩn lớp phủ nếu được cấp quyền
                        } else {
                            alert('Bạn đã từ chối cấp quyền cảm biến. Bạn chỉ có thể vuốt màn hình để xem.');
                            overlay.style.display = 'none';
                        }
                    })
                    .catch(console.error);
            } else {
                // Đối với Android hoặc PC không cần xin quyền chủ động bằng code này
                overlay.style.display = 'none';
            }
        });
    </script>
</body>
</html>
