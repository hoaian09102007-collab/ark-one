<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Mô Hình Con Cua - GPS Tối Ưu</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <script>
      AFRAME.registerComponent('gps-proxy', {
        init: function () {
          const el = this.el;
          
          window.addEventListener('gps-camera-update-position', (e) => {
            // Lấy tọa độ thực tế hiện tại của người dùng
            const userLat = e.detail.position.latitude;
            const userLng = e.detail.position.longitude;
            
            // Tọa độ mục tiêu của con cua
            const targetLat = 10.421500;
            const targetLng = 105.643072;
            
            // Tính khoảng cách ước tính (đơn vị: mét) bằng công thức đơn giản
            const distance = Math.sqrt(Math.pow((userLat - targetLat) * 111139, 2) + Math.pow((userLng - targetLng) * 111139 * Math.cos(userLat * Math.PI / 180), 2));
            
            // Nếu người dùng đang ở trong phạm vi sai số 100 mét
            if (distance <= 100) {
              // Di chuyển mô hình con cua đến gần người dùng hơn một chút (về phía trước 5-10 mét) để chắc chắn nhìn thấy
              // Hoặc giữ nguyên tọa độ nhưng tăng kích thước (scale) để không bị quá nhỏ từ xa
              el.setAttribute('scale', '0.2 0.2 0.2'); // Phóng to một chút để dễ nhìn thấy từ khoảng cách 100m
            } else {
              el.setAttribute('scale', '0.05 0.05 0.05'); // Trở về kích thước cũ nếu đi quá xa
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false" 
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="bird-obj" src="./assets/10012_crab_v2_iterations-1.obj"></a-asset-item>
        <a-asset-item id="bird-mtl" src="./assets/10012_crab_v2_iterations-1.mtl"></a-asset-item>
      </a-assets>
      
      <a-obj-model 
        src="#bird-obj" 
        mtl="#bird-mtl" 
        gps-entity-place="latitude: 10.421500; longitude: 105.643072;"
        scale="0.05 0.05 0.05"
        position="0 0 0"
        rotation="0 0 0"
        gps-proxy>
      </a-obj-model>
      
      <a-entity 
        camera 
        gps-camera="maxDistance: 150; minDistance: 1;" 
        rotation-reader>
      </a-entity>
      
    </a-scene>
  </body>
</html>
